model_list:
  - model_name: agent-main
    model_info:
      # OpenAI 是协议适配器；显式标明实际供应商，供模型选择器分组。
      provider: MiniMax
      display_name: MiniMax-M3
    litellm_params:
      model: os.environ/PRIMARY_MODEL
      api_base: os.environ/PRIMARY_API_BASE
      api_key: os.environ/PRIMARY_API_KEY
      timeout: 180
      stream_timeout: 180
      max_retries: 0

# 取得独立备用渠道后取消下面注释，并在 .env 填入对应的三个变量。
#  - model_name: agent-backup
#    litellm_params:
#      model: os.environ/BACKUP_MODEL
#      api_base: os.environ/BACKUP_API_BASE
#      api_key: os.environ/BACKUP_API_KEY
#      timeout: 180
#      stream_timeout: 180
#      max_retries: 0

router_settings:
  num_retries: 1
  allowed_fails: 2
  cooldown_time: 30
  # fallbacks: [{agent-main: [agent-backup]}]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  trusted_proxy_ranges: []
  # 配置文件作为渠道配置来源，避免 UI 与 YAML 配置不一致。
  store_model_in_db: false

litellm_settings:
  set_verbose: false
