<text x="60" y="995.0" fill="#64748b" font-size="18" font-family="Microsoft YaHei,Arial,sans-serif">支撑关系说明：主 Agent 使用会话检查点、记忆后端；工具按需使用沙箱与文件存储。</text>
<rect x="60" y="1030" width="1480" height="130" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="82" y="1068.0" fill="#0f172a" font-size="22" font-family="Microsoft YaHei,Arial,sans-serif">这一版具体精简什么？</text>
<text x="82" y="1100.0" fill="#475569" font-size="17" font-family="Microsoft YaHei,Arial,sans-serif">① 合并审批与提问的公共流程，退役旧内存等待审批    ② 子 Agent 去掉重复的 Spec 与转换层</text>
<text x="82" y="1125.5" fill="#475569" font-size="17" font-family="Microsoft YaHei,Arial,sans-serif">③ 普通 / 流式调用只复用共同准备逻辑    ④ 不新增 Manager、Factory 或通用基类</text>
<text x="60" y="1197.0" fill="#64748b" font-size="17" font-family="Microsoft YaHei,Arial,sans-serif">图中方框表示职责，不要求“一框一个新模块”。这是待实施方案，不代表重构已经完成。</text>
